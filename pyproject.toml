[project]
name = "srd46-query-environment"
version = "1.0.0.post1"
description = "Reproducible SRD-46 query, browser, and evaluation environment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp==3.4.4",
    "mcp==1.28.1",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "prompt_toolkit==3.0.53",
    "sqlglot==30.18.0",
    "rdkit==2026.3.3",
    "pubchempy==1.0.5",
    "flask==3.1.3",
    "markdown==3.10.2",
    "markupsafe==3.0.3",
    "numpy==2.5.1",
    "matplotlib==3.11.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
